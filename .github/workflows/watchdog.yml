name: Watchdog Worker

# Tests the Cloudflare Worker on every change, and deploys it from main.
# Deploying needs the repo secret CLOUDFLARE_API_TOKEN (Cloudflare dashboard → My Profile →
# API Tokens → "Edit Cloudflare Workers" template). Without it, the deploy step is skipped.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/watchdog/**'
      - 'packages/core/**'
      - 'package-lock.json'
      - '.github/workflows/watchdog.yml'
  pull_request:
    paths:
      - 'apps/watchdog/**'
      - 'packages/core/**'
      - '.github/workflows/watchdog.yml'

concurrency:
  group: watchdog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test core and Worker
        run: |
          npm test --workspace @wakey/core
          npm test --workspace @wakey/watchdog
          npm run typecheck --workspace @wakey/watchdog

      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/watchdog
        run: npx wrangler deploy

      - name: Deploy skipped
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret not set; Worker not deployed."
